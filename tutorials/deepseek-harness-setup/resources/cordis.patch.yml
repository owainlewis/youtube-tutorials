# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Native product subagent providers (host plane), enabled 2026-08-19:
- id: subagent-codex
  name: '@deepseek-ai/dsh-subagent-codex'

- id: subagent-claude-code
  name: '@deepseek-ai/dsh-subagent-claude-code'

# DS Kanban: kanban board across all sessions/projects (client view), local dev:
- insert:
    - id: ds-kanban
      name: dsh-client-ui-ds-kanban

# Linear MCP (hosted, streamable-http, bearer token auth):
- insert:
    - id: mcp-linear
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: linear
        transport: streamable-http
        url: https://mcp.linear.app/mcp
        headers:
          Authorization: 'Bearer XXX'
