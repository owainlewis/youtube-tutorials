<g font-family="sans-serif" fill="#17251f" text-anchor="middle" font-size="30"><text x="225" y="430">Monitoring</text><text x="575" y="430">Pub/Sub</text><text x="925" y="430">ADK + Gemini</text><text x="1320" y="430">Incident dashboard</text></g>
