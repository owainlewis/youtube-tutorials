<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="factory-loops-title factory-loops-desc">
<title id="factory-loops-title">Factory loops</title><desc id="factory-loops-desc">Build, review, deploy and observe, and improve form connected feedback loops. Review findings return to implementation; production evidence informs the next change. Humans set boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#29654d"/></marker></defs>
<rect width="1040" height="470" rx="16" fill="#f0f4ed"/>
<g font-family="Arial, sans-serif" fill="#20352f"><rect x="45" y="85" width="220" height="115" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="155.0" y="128" text-anchor="middle" font-size="25" font-weight="600">Build</text><text x="155.0" y="162" text-anchor="middle" font-size="18" fill="#60726a">Write · test · revise</text><rect x="300" y="85" width="220" height="115" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="410.0" y="128" text-anchor="middle" font-size="25" font-weight="600">Review</text><text x="410.0" y="162" text-anchor="middle" font-size="18" fill="#60726a">Findings + risk</text><rect x="555" y="85" width="220" height="115" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="665.0" y="128" text-anchor="middle" font-size="25" font-weight="600">Deploy + observe</text><text x="665.0" y="162" text-anchor="middle" font-size="18" fill="#60726a">Watch the change</text><rect x="810" y="85" width="185" height="115" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="902.5" y="128" text-anchor="middle" font-size="25" font-weight="600">Improve</text><text x="902.5" y="162" text-anchor="middle" font-size="18" fill="#60726a">Propose fixes</text><path d="M265 145H297" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 145H552" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 145H807" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M410 200V267H155V203" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="253" text-anchor="middle" fill="#29654d" font-size="18">Fix review findings</text><path d="M902 200V375H155V203" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="540" y="362" text-anchor="middle" fill="#29654d" font-size="18">Production evidence becomes the next change</text><text x="45" y="43" font-size="19" fill="#60726a">Human-defined outcome and action boundaries</text><text x="555" y="274" font-size="19" fill="#985621">Uncertain or high impact?</text><text x="555" y="302" font-size="19" fill="#985621">Return the decision to a human.</text></g></svg>