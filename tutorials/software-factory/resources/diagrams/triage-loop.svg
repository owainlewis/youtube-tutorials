<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="triage-loop-title triage-loop-desc">
<title id="triage-loop-title">Triage loop</title><desc id="triage-loop-desc">Monitoring sends an incident through Pub/Sub to the private ADK worker. The worker reads logs, metrics and revisions and stores a triage brief in Firestore. The dashboard displays active incidents and recovered history. Humans perform recovery.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#29654d"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f0f4ed"/>
<g font-family="Arial, sans-serif" fill="#20352f"><rect x="45" y="55" width="240" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="165.0" y="98" text-anchor="middle" font-size="25" font-weight="600">Monitoring alert</text><text x="165.0" y="132" text-anchor="middle" font-size="18" fill="#60726a">Incident opens or closes</text><rect x="385" y="55" width="230" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="500.0" y="98" text-anchor="middle" font-size="25" font-weight="600">Pub/Sub</text><text x="500.0" y="132" text-anchor="middle" font-size="18" fill="#60726a">Authenticated delivery</text><rect x="715" y="55" width="280" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="855.0" y="98" text-anchor="middle" font-size="25" font-weight="600">ADK + Gemini</text><text x="855.0" y="132" text-anchor="middle" font-size="18" fill="#60726a">Private Cloud Run worker</text><path d="M285 110H382" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M615 110H712" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="715" y="245" width="280" height="110" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="855.0" y="288" text-anchor="middle" font-size="25" font-weight="600">Read evidence</text><text x="855.0" y="322" text-anchor="middle" font-size="18" fill="#60726a">Logs · metrics · revisions</text><path d="M855 160V242" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="385" y="425" width="250" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="510.0" y="468" text-anchor="middle" font-size="25" font-weight="600">Firestore</text><text x="510.0" y="502" text-anchor="middle" font-size="18" fill="#60726a">Durable incident record</text><rect x="45" y="425" width="260" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="175.0" y="468" text-anchor="middle" font-size="25" font-weight="600">Incident dashboard</text><text x="175.0" y="502" text-anchor="middle" font-size="18" fill="#60726a">Active + recovered</text><path d="M855 355V478H638" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="827" y="405" text-anchor="middle" fill="#29654d" font-size="18">Publish the brief</text><path d="M385 478H308" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="264" font-size="29" font-weight="600">Triage only.</text><text x="45" y="307" font-size="21">Likely cause. Evidence. Recommended action.</text><text x="45" y="347" font-size="20" fill="#60726a">A human performs recovery.</text></g></svg>