<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="pr-loop-title pr-loop-desc">
<title id="pr-loop-title">Pr loop</title><desc id="pr-loop-desc">Inspect current PR code, assess its risk, and check readiness. Merge only if every gate passes; hold all others. Reassess every new commit.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#29654d"/></marker></defs>
<rect width="1040" height="450" rx="16" fill="#f0f4ed"/>
<g font-family="Arial, sans-serif" fill="#20352f"><rect x="45" y="60" width="245" height="100" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="167.5" y="103" text-anchor="middle" font-size="25" font-weight="600">Open PRs</text><text x="167.5" y="137" text-anchor="middle" font-size="18" fill="#60726a">Current commit + diff</text><rect x="385" y="60" width="270" height="100" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="520.0" y="103" text-anchor="middle" font-size="25" font-weight="600">Assess risk</text><text x="520.0" y="137" text-anchor="middle" font-size="18" fill="#60726a">Against a written policy</text><rect x="750" y="60" width="245" height="100" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="872.5" y="103" text-anchor="middle" font-size="25" font-weight="600">Check readiness</text><text x="872.5" y="137" text-anchor="middle" font-size="18" fill="#60726a">CI + reviews + freshness</text><path d="M290 110H382" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M655 110H747" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="585" y="290" width="190" height="95" rx="10" fill="#e1eedf" stroke="#bacbbf"/><text x="680.0" y="333" text-anchor="middle" font-size="25" font-weight="600">Merge</text><text x="680.0" y="367" text-anchor="middle" font-size="18" fill="#60726a">Eligible low risk</text><rect x="805" y="290" width="190" height="95" rx="10" fill="#fbecd9" stroke="#bacbbf"/><text x="900.0" y="333" text-anchor="middle" font-size="25" font-weight="600">Hold</text><text x="900.0" y="367" text-anchor="middle" font-size="18" fill="#60726a">Anything else</text><path d="M872 160V218H680V287" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="685" y="203" text-anchor="middle" fill="#29654d" font-size="18">All gates pass</text><path d="M910 160V287" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="950" y="240" text-anchor="middle" fill="#29654d" font-size="18">Gate fails</text><text x="45" y="280" font-size="26" font-weight="600">New commit?</text><text x="45" y="316" font-size="22">The old assessment expires.</text><text x="45" y="352" font-size="18" fill="#60726a">A label is never permanent merge permission.</text></g></svg>