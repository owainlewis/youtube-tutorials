<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="build-loop-title build-loop-desc">
<title id="build-loop-title">Build loop</title><desc id="build-loop-desc">An agent changes code and runs checks. Failed checks feed back into another implementation attempt.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#29654d"/></marker></defs>
<rect width="1040" height="280" rx="16" fill="#f0f4ed"/>
<g font-family="Arial, sans-serif" fill="#20352f"><rect x="95" y="65" width="300" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="245.0" y="108" text-anchor="middle" font-size="25" font-weight="600">Agent changes code</text><text x="245.0" y="142" text-anchor="middle" font-size="18" fill="#60726a">Outcome + context</text><rect x="645" y="65" width="300" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="795.0" y="108" text-anchor="middle" font-size="25" font-weight="600">Build and test</text><text x="795.0" y="142" text-anchor="middle" font-size="18" fill="#60726a">Evidence of behavior</text><path d="M395 118H642" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="100" text-anchor="middle" fill="#29654d" font-size="18">Run checks</text><path d="M795 170V235H245V173" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="225" text-anchor="middle" fill="#29654d" font-size="18">Failures guide the next attempt</text></g></svg>