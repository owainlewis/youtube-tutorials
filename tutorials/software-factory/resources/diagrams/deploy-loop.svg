<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="315" viewBox="0 0 1040 315" role="img" aria-labelledby="deploy-loop-title deploy-loop-desc">
<title id="deploy-loop-title">Deploy loop</title><desc id="deploy-loop-desc">An approved change is observed against explicit success and failure signals. The permitted next step is continuing, holding, or escalation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#29654d"/></marker></defs>
<rect width="1040" height="315" rx="16" fill="#f0f4ed"/>
<g font-family="Arial, sans-serif" fill="#20352f"><rect x="40" y="55" width="240" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="160.0" y="98" text-anchor="middle" font-size="25" font-weight="600">Approved change</text><text x="160.0" y="132" text-anchor="middle" font-size="18" fill="#60726a">Release boundary</text><rect x="370" y="55" width="290" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="515.0" y="98" text-anchor="middle" font-size="25" font-weight="600">Observe its signals</text><text x="515.0" y="132" text-anchor="middle" font-size="18" fill="#60726a">Errors · latency · behavior</text><rect x="750" y="55" width="250" height="105" rx="10" fill="#fffefa" stroke="#bacbbf"/><text x="875.0" y="98" text-anchor="middle" font-size="25" font-weight="600">Decide next step</text><text x="875.0" y="132" text-anchor="middle" font-size="18" fill="#60726a">Continue · hold · escalate</text><path d="M280 110H367" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660 110H747" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875 160V250H515V163" fill="none" stroke="#29654d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="680" y="236" text-anchor="middle" fill="#29654d" font-size="18">Keep watching while the rollout progresses</text></g></svg>