<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Incident desk · Software Factory</title>
<style>
:root{--paper:#f7f6f2;--white:#fffefa;--ink:#222c29;--muted:#626b65;--line:#d8ddd5;--green:#266449;--green-bg:#eaf2e9;--amber:#88500e;--amber-bg:#faf0dd;--red:#a03427;--red-bg:#fbece6;--blue:#315b7a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}::selection{background:#d1e7d4;color:var(--ink)}a{color:var(--green);text-underline-offset:4px;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}button{font:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:5px}header{border-bottom:1px solid var(--line)}.bar{max-width:1180px;margin:auto;padding:22px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:15px;font-weight:650;display:flex;gap:11px;align-items:center}.mark{width:21px;height:21px;color:var(--green)}.quiet{color:var(--muted);font-size:13px}.connection{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:var(--muted);border-radius:50%;flex:none}.dot.live{background:var(--green)}.dot.warn{background:var(--amber)}main{max-width:1180px;margin:0 auto;padding:58px 40px 70px}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:38px}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,5vw,52px);font-weight:400;line-height:1.1;letter-spacing:-.025em;margin:0 0 12px}p{margin:0;max-width:72ch}.intro p{color:var(--muted)}button{border:1px solid var(--line);border-radius:6px;background:var(--white);padding:8px 16px;color:var(--ink);cursor:pointer;white-space:nowrap}button:hover{border-color:var(--muted);background:#eeefe8}button:disabled{opacity:.55;cursor:wait}.banner{padding:14px 18px;margin:0 0 24px;background:var(--amber-bg);color:var(--amber);border-radius:6px;font-size:14px}.section-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px;gap:16px}h2{font-size:18px;font-weight:600;margin:0}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.empty{padding:58px 0 64px}.empty h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:29px;margin:0 0 9px}.empty p{color:var(--muted);max-width:60ch}.incident{padding:30px 0 34px;border-bottom:1px solid var(--line)}.incident-heading{display:flex;justify-content:space-between;align-items:start;gap:24px}.incident h3{font-size:23px;line-height:1.35;font-weight:550;margin:0 0 8px;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:5px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:650;white-space:nowrap}.badge.triaged{background:var(--green-bg);color:var(--green)}.badge.recovered{background:var(--green-bg);color:var(--green)}.badge.failed{background:var(--red-bg);color:var(--red)}.brief{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:36px;margin-top:26px}.primary{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:25px 28px}.field+.field{margin-top:22px}.field h4{margin:0 0 7px;font-size:13px;font-weight:650;color:var(--muted)}.cause{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.45}.field p{white-space:pre-wrap;overflow-wrap:anywhere}.confidence{font-size:12px;color:var(--muted);margin-top:12px}.evidence{padding:0;margin:0;list-style:none}.evidence li{margin-bottom:15px}.evidence strong{font-size:13px;font-weight:650;display:block}.evidence p{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.evidence a{font-size:13px}.details{margin-top:22px}.details summary{cursor:pointer;color:var(--muted);font-size:13px;width:fit-content}.steps{list-style:none;margin:14px 0 0;padding:0}.steps li{font-size:13px;padding:7px 0;display:flex;gap:15px;align-items:baseline}.steps time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.steps span{overflow-wrap:anywhere}.pending{margin-top:24px;color:var(--muted);max-width:65ch}.failure{color:var(--red)}#history-section{margin-top:48px}.history-item{padding:20px 0;border-bottom:1px solid var(--line)}.history-item>summary{display:flex;justify-content:space-between;align-items:center;gap:20px;cursor:pointer;list-style:none}.history-item>summary::-webkit-details-marker{display:none}.history-title{font-weight:550;overflow-wrap:anywhere}.history-meta{display:flex;align-items:center;gap:18px;flex:none}.history-item[open]>summary{margin-bottom:20px}.history-item .incident{padding:0;border:0}.history-item .incident-heading{display:none}.history-item .brief{margin-top:0}.arrow{width:16px;height:16px;transition:transform .15s ease}.history-item[open] .arrow{transform:rotate(90deg)}footer{border-top:1px solid var(--line);margin-top:50px;padding-top:18px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:700px){.bar{padding:18px 22px}.bar>.quiet{display:none}main{padding:38px 22px 40px}.intro{align-items:start}.intro p{font-size:14px}.intro button{padding:7px 11px;margin-top:4px}.brief{grid-template-columns:1fr;gap:24px}.primary{padding:21px}.incident-heading{gap:13px}.incident h3{font-size:20px}.badge{font-size:11px}.history-meta time{display:none}.history-item>summary{align-items:start}.history-title{font-size:15px}footer{flex-direction:column;gap:5px}.cause{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 18V6h6v12M9 10h6v8M15 3h6v15M2 21h20"/></svg>Software Factory</div><span class="quiet">Incident desk</span><div class="connection quiet"><span id="connection-dot" class="dot"></span><span id="connection">Connecting</span></div></div></header>
<main>
<div class="intro"><div><h1>Incident desk</h1><p>Operational evidence. A clear next step.</p></div><button id="refresh" type="button">Refresh</button></div>
<div id="notice" class="banner" role="status" hidden></div>
<section aria-labelledby="active-heading"><div class="section-top"><h2 id="active-heading">Active incidents</h2><span id="active-count" class="count"></span></div><div id="active"><div class="empty"><h3>Loading incidents</h3><p>Connecting to the incident service.</p></div></div></section>
<section id="history-section" aria-labelledby="history-heading" hidden><div class="section-top"><h2 id="history-heading">Incident history</h2><span id="history-count" class="count"></span></div><div id="history"></div></section>
<footer><span id="service">Monitoring notifications initiate each investigation.</span><span>Triage only. Mitigations stay with the operator.</span></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let lastSuccess=0, lastSignature='', busy=false;
const label={investigating:'Investigating',triaged:'Triaged',failed:'Triage failed',recovered:'Recovered'};
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined&&text!==null)node.textContent=String(text);if(cls)node.className=cls;return node;}
function date(value){const d=new Date(value);return value&&!isNaN(d)?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'}).format(d):'Time unavailable';}
function time(value){const node=el('time',date(value));if(value)node.dateTime=value;return node;}
function cloudLink(url,text){try{const u=new URL(url);if(u.protocol!=='https:'||u.hostname!=='console.cloud.google.com'||u.username||u.password)return null;const a=el('a',text);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch{return null;}}
function field(title,value,cls){const box=el('div',null,'field');box.append(el('h4',title),el('p',value||'Not established.',cls));return box;}
function badge(item){const status=item.state==='closed'?'recovered':item.status;return el('span',label[status]||'Investigating','badge '+(Object.hasOwn(label,status)?status:'investigating'));}
function incident(item){const article=el('article',null,'incident');const heading=el('div',null,'incident-heading');const title=el('div');title.append(el('h3',item.title||'Monitoring incident'));const meta=el('div',null,'meta');const started=el('span','Opened ');started.append(time(item.started_at));meta.append(started);const updated=el('span','Updated ');updated.append(time(item.updated_at));meta.append(updated);const link=cloudLink(item.url,'View in Cloud Monitoring');if(link)meta.append(link);title.append(meta);heading.append(title,badge(item));article.append(heading);
if(item.report){const r=item.report,brief=el('div',null,'brief'),primary=el('div',null,'primary');primary.append(field('Likely cause',r.likely_cause,'cause'));if(['low','medium','high'].includes(r.confidence))primary.append(el('p',r.confidence[0].toUpperCase()+r.confidence.slice(1)+' confidence','confidence'));primary.append(field('Impact',r.impact),field('Recommended action',r.recommended_action),field('How to verify',r.verification));const supporting=el('div');const evidence=el('div',null,'field');evidence.append(el('h4','Evidence'));const list=el('ul',null,'evidence');for(const entry of Array.isArray(r.evidence)?r.evidence:[]){const li=el('li');li.append(el('strong',entry.source||'Source'),el('p',entry.detail||'No detail provided.'));const a=cloudLink(entry.url,'Open evidence');if(a)li.append(a);list.append(li);}if(!list.children.length)list.append(el('li','No supporting evidence was recorded.'));evidence.append(list);supporting.append(evidence,field('What remains uncertain',r.uncertainty));brief.append(primary,supporting);article.append(brief);
}else{article.append(el('p',item.status==='failed'?'The investigation could not be completed. Review the incident in Cloud Monitoring.':item.state==='closed'?'Monitoring reported recovery before a triage brief was available.':'The agent is gathering logs, metrics and deployment details. Its findings will appear here.','pending'+(item.status==='failed'?' failure':'')));}
if(Array.isArray(item.steps)&&item.steps.length){const details=el('details',null,'details');details.append(el('summary','Investigation activity'));const list=el('ol',null,'steps');for(const step of item.steps){const li=el('li');li.append(time(step.at),el('span',(step.tool||'Investigation')+' · '+(step.status||'Recorded')));list.append(li);}details.append(list);article.append(details);}return article;}
function render(data){const openDetails=new Set([...document.querySelectorAll('#history details.history-item[open]')].map(n=>n.dataset.id));const active=data.incidents.filter(i=>i.state!=='closed'),closed=data.incidents.filter(i=>i.state==='closed');$('active').replaceChildren();$('active-count').textContent=active.length?active.length+' open':'';if(active.length){for(const i of active)$('active').append(incident(i));}else{const empty=el('div',null,'empty');empty.append(el('h3','No active incidents'),el('p','No open incidents have been received. New alerts and their investigations will appear here.'));$('active').append(empty);}$('history').replaceChildren();$('history-section').hidden=!closed.length;$('history-count').textContent=closed.length+' recovered';for(const i of closed){const details=el('details',null,'history-item');details.dataset.id=String(i.id);details.open=openDetails.has(String(i.id));const summary=el('summary');const title=el('div');title.append(el('div',i.title||'Monitoring incident','history-title'));const meta=el('div',null,'history-meta');meta.append(time(i.ended_at||i.updated_at),badge(i));const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 20 20');arrow.setAttribute('class','arrow');arrow.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','m7 4 6 6-6 6');path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','1.5');arrow.append(path);meta.append(arrow);summary.append(title,meta);details.append(summary,incident(i));$('history').append(details);}$('service').textContent=data.service||'Monitoring notifications initiate each investigation.';}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('/api/incidents',{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!data||!Array.isArray(data.incidents))throw new Error('Invalid incident response');const signature=JSON.stringify(data);if(signature!==lastSignature){render(data);lastSignature=signature;}lastSuccess=Date.now();$('notice').hidden=true;$('connection').textContent='Updated '+new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(lastSuccess);$('connection-dot').className='dot live';}catch(error){$('notice').hidden=false;$('notice').textContent=lastSuccess?'Updates are unavailable. Showing the last successful response from '+new Date(lastSuccess).toLocaleTimeString()+'. Retrying automatically.':'Unable to load incidents. Check the service connection or sign in again. Retrying automatically.';$('connection').textContent=lastSuccess?'Updates delayed':'Connection unavailable';$('connection-dot').className='dot warn';if(!lastSuccess){const empty=el('div',null,'empty');empty.append(el('h3','Incident status unavailable'),el('p','An unavailable connection does not mean the service is healthy. Select Refresh to try again.'));$('active').replaceChildren(empty);}}finally{clearTimeout(timeout);busy=false;$('refresh').disabled=false;}}
$('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,5000);
</script>
</body>
</html>
