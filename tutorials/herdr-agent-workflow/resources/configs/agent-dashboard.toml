# Agent dashboard config for recording or daily agent supervision.
# This makes agent state more visible and reduces noisy audio.

onboarding = false

[theme]
name = "rose-pine"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[theme.custom]
accent = "#c4a7e7"
green = "#9ccfd8"
blue = "#31748f"
red = "#eb6f92"
yellow = "#f6c177"

[keys]
prefix = "ctrl+b"
toggle_sidebar = "prefix+b"
help = "prefix+?"
new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
zoom = "prefix+z"
close_pane = "prefix+x"
detach = "prefix+q"

[ui]
sidebar_width = 34
sidebar_min_width = 22
sidebar_max_width = 44
mobile_width_threshold = 72
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
confirm_close = true
prompt_new_tab_name = true
accent = "#c4a7e7"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true
