# Basic Herdr config.
# Copy to ~/.config/herdr/config.toml, then run:
# herdr server reload-config

onboarding = false

[theme]
name = "terminal"

[ui]
sidebar_width = 30
confirm_close = true
prompt_new_tab_name = true
pane_borders = true
pane_gaps = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
