name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository structure and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v4
      - uses: hashicorp/setup-terraform@v4
      - name: Run repository checks
        run: just check

  offline-tests:
    name: Existing offline tutorial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Run offline tests
        run: python3 scripts/run_offline_tests.py --kind offline

  network-tests:
    name: Optional dependency-backed tutorial tests
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Run dependency-backed tests without a project lockfile
        run: python3 scripts/run_offline_tests.py --kind network
