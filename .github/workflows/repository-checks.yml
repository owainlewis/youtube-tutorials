name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  repository:
    name: Repository and offline tutorial checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: extractions/setup-just@v4
      - uses: hashicorp/setup-terraform@v4
      - name: Run repository checks
        run: just check

  network-tests:
    name: Optional dependency-backed tutorial tests
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Run isolated optional checks
        run: python3 scripts/run_offline_tests.py --kind network

  dependency-resolution:
    name: Resolve current Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Resolve every Python tutorial manifest without lockfiles
        run: python3 scripts/check_python_dependencies.py
